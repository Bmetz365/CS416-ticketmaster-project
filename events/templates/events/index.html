{% extends 'events/base.html' %}
{% load static %}

{% block content %}
<div class="container-fluid bg-dark text-white py-5">
    <div class="container">
        <div class="row justify-content-center text-center">
            <div class="col-lg-8">
                <h1 class="display-4 fw-normal">Ticketmaster</h1>
                <p class="lead mb-4">Quickly find tickets around you & build your budget itinerary</p>

                <div class="input-group mb-3">
                    <input class="form-control" list="genreOptions" id="classificationInput" placeholder="Type to search by genre">
                    <datalist id="genreOptions">
                        <option value="Music">
                        <option value="Sports">
                        <option value="Theater">
                        <option value="Family">
                        <option value="Arts & Theater">
                        <option value="Concerts">
                        <option value="Comedy">
                        <option value="Dance">
                    </datalist>
                    <input type="text" class="form-control" id="cityInput" placeholder="Enter a city e.g., Hartford">
                    <button class="btn btn-primary" id="searchBtn" type="button">SEARCH</button>
                </div>

                <div id="alertBox" class="alert alert-danger d-none" role="alert">
                    <span id="alertMessage">Search term cannot be empty. Please enter a search term.</span>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div id="eventCount" class="mb-3 fw-bold text-secondary"></div>
            <div id="results" class="vstack gap-3"></div>
        </div>
    </div>
</div>

<div class="modal fade" id="saveEventModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add to Itinerary</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="fw-bold text-primary" id="modalEventTitleDisplay"></p>
                <input type="hidden" id="modalEventId">
                <input type="hidden" id="modalEventName">
                <input type="hidden" id="modalVenueName">
                <input type="hidden" id="modalVenueLocation">
                <input type="hidden" id="modalEventDate">
                <input type="hidden" id="modalEventTime">
                <input type="hidden" id="modalImageUrl">
                <input type="hidden" id="modalTicketUrl">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Max Budget / Ticket ($)</label>
                        <input type="number" step="0.01" class="form-control" id="modalBudgetInput" value="75.00">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Ticket Quantity</label>
                        <input type="number" min="1" class="form-control" id="modalQtyInput" value="1">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Priority</label>
                        <select class="form-select" id="modalPriorityInput">
                            <option value="MUST" selected>Must-Go</option>
                            <option value="MAYBE">Maybe</option>
                            <option value="BACKUP">Backup</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Notes (seating section, friends going, etc.)</label>
                        <textarea class="form-control" id="modalNotesInput" rows="2"></textarea>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="confirmSaveEventBtn">Save Event</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    window.IS_AUTHENTICATED = {{ user.is_authenticated|yesno:"true,false" }};
    window.SAVED_EVENT_IDS = {{ saved_ids_json|safe }};
</script>
<script src="{% static 'events/js/ticketmaster.js' %}"></script>
{% endblock %}
